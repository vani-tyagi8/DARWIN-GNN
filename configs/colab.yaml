seed: 42
device: auto
data:
  root: data/processed
  dataset: devign
  batch_size: 8
  num_workers: 2
model:
  input_dim: 100
  hidden_dim: 200
  num_steps: 6
  num_edge_types: 4
training:
  strategy: baseline
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.001
  patience: 8
  threshold: 0.5
  focal_gamma: 2.0
  focal_alpha: null
  amp: true
output_dir: runs

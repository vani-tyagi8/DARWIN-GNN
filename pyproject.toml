[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devign-imbalance"
version = "0.2.0"
description = "Controlled class-imbalance experiments for Devign-based vulnerability detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "ijson>=3.2",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
devign-experiment = "devign_imbalance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
